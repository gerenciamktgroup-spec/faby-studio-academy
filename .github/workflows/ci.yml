name: Quality Gate & Staging Verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/*
      - antigravity/*

jobs:
  quality-gate:
    name: Quality Gate (Static Analysis, Build & E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://odsldktasbexyfjpijjg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kc2xka3Rhc2JleHlmcGppampnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4OTYwMDAsImV4cCI6MjA1NDQ3MjAwMH0.test_anon_key_for_ci_pipeline_building_and_linting_32chars
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kc2xka3Rhc2JleHlmcGppampnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTczODg5NjAwMCwiZXhwIjoyMDU0NDcyMDAwfQ.test_service_key_for_ci_pipeline_building_and_linting_40chars_long
      AUDIT_IP_HASH_SALT: ci_test_audit_ip_hash_salt_min_32_chars_long_12345
      CERTIFICATE_SIGNING_SECRET: ci_test_certificate_signing_secret_min_32_chars_long_12345
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  staging-live-verification:
    name: Staging Live Security Matrix & Catalog Audit
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.repository == 'gerenciamktgroup-spec/faby-studio-academy' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: staging
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUDIT_IP_HASH_SALT: ${{ secrets.AUDIT_IP_HASH_SALT }}
      CERTIFICATE_SIGNING_SECRET: ${{ secrets.CERTIFICATE_SIGNING_SECRET }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      ENABLE_PUBLIC_REGISTRATION: "true"
      LIVE_AUTH_E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail closed when Staging secrets are missing
        shell: bash
        run: |
          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            AUDIT_IP_HASH_SALT
            CERTIFICATE_SIGNING_SECRET
            SUPABASE_PROJECT_REF
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required Staging secret: ${name}"
              exit 1
            fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Link the exact Staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending Staging migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Verify remote migration history
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Lint the linked PostgreSQL schemas
        run: supabase db lint --linked --fail-on error --schema public,extensions
      - name: Run Live PostgreSQL 17 Catalog Security Audit
        run: npm run db:audit:live
      - name: Run Live RBAC & RLS Security Matrix
        run: node scripts/test-roles-real.mjs
      - name: Install browser for authenticated role E2E
        run: npx playwright install --with-deps chromium
      - name: Run authenticated role E2E against Staging
        run: npx playwright test tests/e2e/authenticated-roles.spec.ts
